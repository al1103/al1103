    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a2b25"/><stop offset="1" stop-color="#03060a"/></linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#7cf6d6" stop-opacity="0.85"/><stop offset="0.5" stop-color="#4fd6c4" stop-opacity="0.35"/><stop offset="1" stop-color="#8b7cff" stop-opacity="0"/></radialGradient>
    <linearGradient id="faceTop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1f5f52"/><stop offset="1" stop-color="#113c34"/></linearGradient>
