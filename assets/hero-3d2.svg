      @keyframes pulse { 0%, 100% { opacity: 0.25; } 50% { opacity: 0.9; } }
      .pulse { animation: pulse 3s ease-in-out infinite; }
      @keyframes glow { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
      .sunpulse { animation: glow 8s ease-in-out infinite; }
