    <circle cx="980" cy="180" r="54" fill="none" stroke="#ffffff" stroke-opacity="0.07"/>
    <circle cx="980" cy="180" r="30" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    <path d="M980 96v168M896 180h168" stroke="#ffffff" stroke-opacity="0.07"/>
    <g class="flow" stroke="#5ff0d0" stroke-opacity="0.35" stroke-width="4" stroke-linecap="round"><path d="M980 104v10M980 246v10M904 180h10M1046 180h10"/></g>
