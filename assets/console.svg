  </g>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13">
    <text x="72" y="118" fill="#5ff0d0">$</text>
    <text x="94" y="118" fill="#dfe6ef">whoami</text>
    <text x="72" y="146" fill="#7f8b9b">›</text>
    <text x="94" y="146" fill="#aab6c6">phạm anh tuấn — product engineer</text>
    <text x="72" y="182" fill="#5ff0d0">$</text>
    <text x="94" y="182" fill="#dfe6ef">stack --now</text>
    <text x="72" y="210" fill="#7f8b9b">›</text>
    <text x="94" y="210" fill="#aab6c6">react · node · esp32 · swift · cloudflare</text>
    <text x="72" y="246" fill="#5ff0d0">$</text>
    <text x="94" y="246" fill="#dfe6ef">status</text>
