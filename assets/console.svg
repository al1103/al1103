<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Zilong — terminal profile">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#04060a"/><stop offset="0.6" stop-color="#060910"/><stop offset="1" stop-color="#04070c"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#5ff0d0" stroke-opacity="0.05" stroke-width="1"/></pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1.2" fill="#ffffff" fill-opacity="0.025"/></pattern>
    <radialGradient id="halo" cx="0.82" cy="0.5" r="0.45"><stop offset="0" stop-color="#8b7cff" stop-opacity="0.2"/><stop offset="1" stop-color="#8b7cff" stop-opacity="0"/></radialGradient>
    <linearGradient id="sweepGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8b7cff" stop-opacity="0.45"/><stop offset="1" stop-color="#8b7cff" stop-opacity="0"/></linearGradient>
    <style>
      @keyframes blink { 0%, 45% { opacity: 1; } 46%, 100% { opacity: 0; } }
      .cursor { animation: blink 1.05s steps(1, end) infinite; }
      @keyframes scanline { 0% { transform: translateY(-40px); } 100% { transform: translateY(360px); } }
      .scan { animation: scanline 7s linear infinite; }
      @keyframes pulse { 0%, 100% { opacity: 0.25; } 50% { opacity: 0.95; } }
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
      @keyframes dash { to { stroke-dashoffset: -120; } }
      .flow { animation: dash 6s linear infinite; }
    </style>
  </defs>
  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#grid)"/>
  <rect width="1200" height="360" fill="url(#halo)"/>
  <g stroke="#5ff0d0" stroke-opacity="0.13" stroke-width="1" fill="none">
    <path d="M0 300H120l24-24h96l24 24h120"/>
    <path d="M1200 84h-96l-20 20h-88"/>
  </g>
  <g fill="#5ff0d0" fill-opacity="0.35"><circle cx="120" cy="300" r="2.5"/><circle cx="264" cy="300" r="2.5"/><circle cx="1104" cy="84" r="2.5"/></g>
  <path class="flow" d="M0 300H120l24-24h96l24 24h120" stroke="#5ff0d0" stroke-opacity="0.5" stroke-width="1.5" fill="none" stroke-dasharray="3 21"/>
