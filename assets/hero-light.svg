    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dfeae7"/><stop offset="1" stop-color="#f4f8f7"/></linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#0f9b80" stop-opacity="0.3"/><stop offset="0.5" stop-color="#12b394" stop-opacity="0.12"/><stop offset="1" stop-color="#8b7cff" stop-opacity="0"/></radialGradient>
    <linearGradient id="faceTop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfe9dd"/><stop offset="1" stop-color="#93cfc0"/></linearGradient>
