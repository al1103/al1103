      @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
      .pulse { animation: pulse 3s ease-in-out infinite; }
      @keyframes glow { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
      .sunpulse { animation: glow 8s ease-in-out infinite; }
