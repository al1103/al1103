  <rect width="1200" height="340" fill="url(#grid)"/>
  <rect width="1200" height="340" fill="url(#glow)"/>
  <rect class="sweep" x="0" y="0" width="420" height="340" fill="url(#shimmer)"/>
  <g class="br" stroke="#6ef2cf" stroke-width="1.5" fill="none"><path d="M40 78V40h38"/><path d="M1160 78V40h-38"/><path d="M40 262v38h38"/><path d="M1160 262v38h-38"/></g>
