  <g stroke="#ffffff" stroke-opacity="0.26" stroke-width="1"><path d="M64 228v8M200 228v5M336 228v5M472 228v5M608 228v8M744 228v5M880 228v5M1016 228v5M1136 228v8"/></g>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" letter-spacing="2.5" fill="#8b96a5"><text x="64" y="274">PHẠM ANH TUẤN</text><text x="64" y="296">21.03N 105.85E</text><text x="1136" y="274" text-anchor="end">SYSTEM 2050</text><text x="1136" y="296" text-anchor="end">REV 04 / BUILD PASSING</text></g>
