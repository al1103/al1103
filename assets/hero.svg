    @keyframes blink { 0%, 45% { opacity: 1; } 46%, 100% { opacity: 0; } }
    .cursor { animation: blink 1.1s steps(1, end) infinite; }
    @keyframes flow { to { stroke-dashoffset: -360; } }
    .flow { animation: flow 14s linear infinite; }
    @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.9; } }
    .br { animation: pulse 6s ease-in-out infinite; }
  </style>
