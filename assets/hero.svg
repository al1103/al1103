<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Zilong — product engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#05060a"/><stop offset="0.55" stop-color="#080a10"/><stop offset="1" stop-color="#0b0e14"/></linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6ef2cf" stop-opacity="0"/><stop offset="0.5" stop-color="#6ef2cf" stop-opacity="0.8"/><stop offset="1" stop-color="#6ef2cf" stop-opacity="0"/></linearGradient>
    <linearGradient id="shimmer" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0.06"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/></pattern>
    <radialGradient id="glow" cx="0.1" cy="0" r="0.8"><stop offset="0" stop-color="#6ef2cf" stop-opacity="0.15"/><stop offset="1" stop-color="#6ef2cf" stop-opacity="0"/></radialGradient>
