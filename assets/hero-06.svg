<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Zilong — product engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#04060a"/><stop offset="0.6" stop-color="#070a10"/><stop offset="1" stop-color="#05080d"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/></pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1.2" fill="#ffffff" fill-opacity="0.022"/></pattern>
    <radialGradient id="glow" cx="0.08" cy="0.1" r="0.8"><stop offset="0" stop-color="#5ff0d0" stop-opacity="0.16"/><stop offset="1" stop-color="#5ff0d0" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow2" cx="0.86" cy="0.5" r="0.4"><stop offset="0" stop-color="#8b7cff" stop-opacity="0.18"/><stop offset="1" stop-color="#8b7cff" stop-opacity="0"/></radialGradient>
    <linearGradient id="sweepGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8b7cff" stop-opacity="0.5"/><stop offset="1" stop-color="#8b7cff" stop-opacity="0"/></linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5ff0d0" stop-opacity="0.5"/><stop offset="0.5" stop-color="#5ff0d0" stop-opacity="0.12"/><stop offset="1" stop-color="#5ff0d0" stop-opacity="0"/></linearGradient>
