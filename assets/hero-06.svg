  <g stroke="#ffffff" stroke-opacity="0.24" stroke-width="1"><path d="M64 240v9M196 240v5M328 240v5M460 240v5M592 240v9M724 240v5M856 240v5M988 240v5M1120 240v9"/></g>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" letter-spacing="2.5" fill="#7f8b9b">
