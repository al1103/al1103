  <g opacity="0.16"><text x="58" y="148" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="118" font-weight="600" letter-spacing="22" fill="#8b7cff">ZILONG</text></g>
  <text x="64" y="154" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="118" font-weight="600" letter-spacing="22" fill="#f4f6f8">ZILONG</text>
