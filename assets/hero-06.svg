    <style>
      @keyframes scanx { 0% { transform: translateX(-200px); } 100% { transform: translateX(1240px); } }
      .scanx { animation: scanx 6.5s linear infinite; }
      @keyframes blink { 0%, 45% { opacity: 1; } 46%, 100% { opacity: 0; } }
      .cursor { animation: blink 1.05s steps(1, end) infinite; }
      @keyframes pulse { 0%, 100% { opacity: 0.28; } 50% { opacity: 1; } }
      .pulse { animation: pulse 2.6s ease-in-out infinite; }
      @keyframes br { 0%, 100% { opacity: 0.35; } 50% { opacity: 0.85; } }
      .br { animation: br 5s ease-in-out infinite; }
    </style>
